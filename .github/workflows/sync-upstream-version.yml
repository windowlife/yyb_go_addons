name: Sync upstream version

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync release version to config.json
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: "525815266",
              repo: "YYB-Go-Enhanced"
            });

            const tag = release.data.tag_name;
            const match = /^v?(\d+\.\d+\.\d+)$/.exec(tag);
            if (!match || release.data.draft || release.data.prerelease) {
              throw new Error(`不支持的正式版本标签：${tag}`);
            }
            const latest = match[1];

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = "yyb_go/config.json";
            const branch = "main";

            const { data: file } = await github.rest.repos.getContent({
              owner, repo, path, ref: branch
            });
            if (Array.isArray(file) || file.encoding !== "base64") {
              throw new Error("无法读取目标配置文件");
            }

            const original = Buffer.from(file.content, "base64").toString("utf8");
            const config = JSON.parse(original);
            const current = config.version;

            if (!/^\d+\.\d+\.\d+$/.test(current)) {
              throw new Error(`当前版本格式异常：${current}`);
            }

            const a = latest.split(".").map(Number);
            const b = current.split(".").map(Number);
            const index = a.findIndex((value, i) => value !== b[i]);

            if (index === -1 || a[index] < b[index]) {
              core.info(`无需更新：当前 ${current}，上游 ${latest}`);
              return;
            }

            // 只替换版本值，保留原文件的缩进、换行和其他内容。
            const pattern = /("version"\s*:\s*")([^"]*)(")/g;
            const matches = [...original.matchAll(pattern)];
            if (matches.length !== 1 || matches[0][2] !== current) {
              throw new Error("version 字段不唯一或不匹配，已停止修改");
            }

            const updated = original.replace(
              pattern, (_, before, value, after) => before + latest + after
            );

            const expected = { ...config, version: latest };
            if (JSON.stringify(JSON.parse(updated)) !== JSON.stringify(expected)) {
              throw new Error("检测到版本号以外的变化，已停止提交");
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha: file.sha,
              message: `chore: sync YYB-Go version to ${latest}`,
              content: Buffer.from(updated, "utf8").toString("base64")
            });

            core.info(`已更新：${current} → ${latest}`);
