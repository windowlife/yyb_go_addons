name: Validate Add-on

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository files
        run: python3 tests/validate.py

      - name: Validate startup script syntax
        run: sh -n yyb_go/run.sh

      - name: Build Add-on image
        run: docker build --pull -t yyb_go_addon:test ./yyb_go
